[package]
name = "gpui-libghostty"
description = "Native libghostty terminal component for GPUI"
version = "0.4.1-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
build = "build.rs"
include = ["/src/**", "/shim/**", "/build.rs", "/build_support/**", "/patches/**", "/upstream/**", "/tests/**"]

[package.metadata.release]
pre-release-hook = ["cargo", "run", "--locked", "-p", "xtask", "--", "prepare-ghostty"]

[build-dependencies]
diffy.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
ureq.workspace = true

[dependencies]
async-channel.workspace = true
image = { version = "0.25", default-features = false }
raw-window-handle.workspace = true
tempfile = "3.27"

[target.'cfg(target_os = "linux")'.dependencies]
khronos-egl = { version = "6.0", features = ["dynamic"] }
libc.workspace = true
libloading = "0.8"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"

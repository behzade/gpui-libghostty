name: Release crate

on:
  push:
    tags:
      - "gpui-libghostty-v*"
      - "gpui-neovim-v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish tagged crate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Select and validate crate
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          crate="${TAG%-v*}"
          version="${TAG##*-v}"
          case "$crate" in
            gpui-libghostty|gpui-neovim) ;;
            *) echo "Unsupported release tag: $TAG" >&2; exit 1 ;;
          esac
          manifest_version="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          packages = json.load(sys.stdin)["packages"]
          print(next(p["version"] for p in packages if p["name"] == sys.argv[1]))
          ' "$crate")"
          if [[ "$version" != "$manifest_version" ]]; then
            echo "Tag version $version does not match $crate manifest version $manifest_version" >&2
            exit 1
          fi
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish ${{ steps.release.outputs.crate }} ${{ steps.release.outputs.version }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --no-verify --package "${{ steps.release.outputs.crate }}"

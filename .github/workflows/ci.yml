name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-deps.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compatibility resolver tests
        run: node --test .github/scripts/gpui-compat.test.mjs
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (including native build)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Library tests
        run: cargo test -p gpui-libghostty -p gpui-neovim --lib --locked
      - name: GPUI compatibility (Zed Git)
        run: cargo test -p gpui-compat --test zed --locked
      - name: GPUI compatibility (gpui-pre)
        run: cargo test -p gpui-compat --lib --locked
      - name: Doc tests (including API safety checks)
        run: cargo test -p gpui-libghostty -p gpui-neovim --doc --locked

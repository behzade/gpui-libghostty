name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake pkg-config libclang-dev libc++-dev \
            libasound2-dev libfontconfig-dev libfreetype-dev \
            libegl1-mesa-dev libgl1-mesa-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev libssl-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (including native build)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
